<html lang="fr">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Police -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f3f4f6;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: 40px 20px;
    }

    .wrap {
      width: 100%;
      max-width: 1000px;

      background: white;
      border-radius: 24px;

      padding: 32px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);

      border: 1px solid #e5e7eb;
    }

    .hdr {
      margin-bottom: 1.5rem;
    }

    .hdr h1 {
      font-size: 32px;
      font-weight: 700;
      color: #111827;
    }

    .hdr p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 6px;
    }

    .legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #4b5563;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .phase {
      margin-bottom: 2rem;
    }

    .phase-bar {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .phase-progress {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 12px;
      font-size: 12px;
      color: #6b7280;
      font-weight: 500;
    }

    .phase-progress-track {
      flex: 1;
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: #e5e7eb;
    }

    .phase-progress-fill {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: #111827;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .phase-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 0 0 18px;
      align-items: center;
    }

    .phase-stat {
      font-size: 12px;
      color: #4b5563;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: 4px 10px;
    }

    .phase-complete-badge {
      font-size: 12px;
      font-weight: 600;
      color: #15803d;
      background: #dcfce7;
      border: 1px solid #86efac;
      border-radius: 999px;
      padding: 4px 12px;
      display: none;
    }

    .phase-complete-badge.visible {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .week {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      background: white;
    }

    .week-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
    }

    .week-head:hover {
      background: #f9fafb;
    }

    .week-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wlevel {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .wname {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
    }

    .wdates {
      font-size: 12px;
      color: #9ca3af;
    }

    .arrow {
      font-size: 16px;
      color: #9ca3af;
      transition: transform .25s;
      display: inline-block;
    }

    .week-body {
      display: none;
      border-top: 1px solid #e5e7eb;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .week-body.open {
      display: block;
    }

    .day-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      border-bottom: 1px solid #e5e7eb;
      min-width: 520px;
    }

    .day-row:last-child {
      border-bottom: none;
    }

    .day-lbl {
      padding: 12px;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      background: #f9fafb;
      line-height: 1.4;
    }

    .day-txt {
      padding: 12px 16px;
      font-size: 14px;
      color: #111827;
      line-height: 1.7;
    }

    .week-head-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .week-check-all {
      font-size: 11px;
      font-weight: 500;
      color: #6b7280;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 3px 9px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    .week-check-all:hover {
      background: #e5e7eb;
      color: #374151;
    }

    .week-progress-count {
      font-size: 12px;
      font-weight: 500;
      color: #9ca3af;
      white-space: nowrap;
    }

    .week-progress-count.all-done {
      color: #16a34a;
    }

    .day-check {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 12px 16px;
    }

    .day-check input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2563eb;
      cursor: pointer;
      flex-shrink: 0;
    }

    .day-row.done {
      background: #f9fefb;
    }

    .day-row.done .day-lbl {
      color: #86efac;
      background: #f0fdf4;
    }

    .day-row.done .day-txt {
      color: #9ca3af;
      text-decoration: line-through;
      text-decoration-color: #d1fae5;
    }

    .day-row.done .day-check input {
      accent-color: #16a34a;
    }

    .day-row.rest.done .day-lbl {
      background: #d1fae5;
      color: #15803d;
    }

    .day-row.rest.done .day-txt {
      background: #f0fdf4;
    }

    .day-row.rest .day-lbl {
      background: #E1F5EE;
      color: #0F6E56;
    }

    .day-row.rest .day-txt {
      background: #F5FDF9;
      color: #0F6E56;
    }

    .exam-row .day-txt {
      background: #FBEAF0;
      color: #993556;
      font-weight: 500;
    }

    .exam-row .day-lbl {
      background: #F4C0D1;
      color: #72243E;
      font-weight: 600;
    }

    .late-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      color: #b45309;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 4px;
      padding: 1px 5px;
      margin-top: 4px;
      line-height: 1.4;
      white-space: nowrap;
    }

    .day-row.overdue .day-lbl {
      background: #fffbeb;
    }

    .day-row.overdue:not(.rest) .day-txt {
      background: #fffbeb;
    }

    .day-row.overdue .day-lbl .day-lbl-name {
      display: block;
    }

    .day-lbl-name {
      display: block;
    }
  </style>
</head>

          {
            name: "Semaine 14 — Semaine de l'examen", dates: "19–26 août", level: "Examen", days: [
              {d: "Mer 19", t: "Révision très légère : Anki 20 min, expressions figées, formules Schreiben. Rien de nouveau."},
              {d: "Jeu 20", t: "Relire ses meilleures productions écrites. Répéter la partie orale une dernière fois."},
              {d: "Ven 21", t: "🌿 Repos total. Promenade, détente. Cerveau en mode récupération complète.", rest: true},
              {d: "Sam 22", t: "Anki 20 min. Revoir les instructions de l'examen : format, durées, consignes officielles."},
              {d: "Dim 23", t: "Repos. Préparer les affaires : pièce d'identité, stylos, confirmation d'inscription."},
              {d: "Lun–Mer", t: "🎯 EXAMEN B1 — Goethe-Zertifikat ou telc. Tu es prêt(e). Viel Erfolg !", exam: true},
            ]
          },
        ]
      }
    ];

    const MONTH_MAP = {'jan': 0, 'fév': 1, 'févr': 1, 'mar': 2, 'avr': 3, 'mai': 4, 'juin': 5, 'juil': 6, 'août': 7, 'sep': 8, 'oct': 9, 'nov': 10, 'déc': 11};

    function parseDayDate(weekDates, dayLabel) {
      const dayNum = parseInt(dayLabel.split(' ').pop());
      if (isNaN(dayNum)) return null;
      const parts = weekDates.split(/\s*–\s*/);
      const startParts = parts[0].trim().split(/\s+/);
      const endParts = parts[1] ? parts[1].trim().split(/\s+/) : [];
      const startNum = parseInt(startParts[0]);
      let month1 = startParts[1] ? MONTH_MAP[startParts[1].toLowerCase()] : undefined;
      let month2 = endParts[1] ? MONTH_MAP[endParts[1].toLowerCase()] : undefined;
      if (month1 === undefined) month1 = month2;
      if (month2 === undefined) month2 = month1;
      const month = (month1 !== month2 && dayNum < startNum) ? month2 : month1;
      return new Date(2026, month, dayNum);
    }

    function build() {
      const root = document.getElementById('root');
      const storageKey = 'roadmap-b1-checklist';
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');

      phases.forEach((ph) => {
        const phDiv = document.createElement('div');
        phDiv.className = 'phase';

        const bar = document.createElement('div');
        bar.className = 'phase-bar';
        bar.style.background = ph.bg;
        bar.style.color = ph.color;
        bar.textContent = ph.name;
        phDiv.appendChild(bar);

        const progress = document.createElement('div');
        progress.className = 'phase-progress';
        const progressTrack = document.createElement('div');
        progressTrack.className = 'phase-progress-track';
        const progressFill = document.createElement('div');
        progressFill.className = 'phase-progress-fill';
        progressTrack.appendChild(progressFill);
        const progressText = document.createElement('span');
        progress.appendChild(progressTrack);
        progress.appendChild(progressText);

        const stats = document.createElement('div');
        stats.className = 'phase-stats';

        const completeBadge = document.createElement('span');
        completeBadge.className = 'phase-complete-badge';
        completeBadge.innerHTML = '✓ Phase terminée !';

        phDiv.appendChild(progress);
        phDiv.appendChild(stats);

        const phaseDays = ph.weeks.flatMap(wk => wk.days.map(day => ({wk, day})));

        const statPercent = document.createElement('div');
        statPercent.className = 'phase-stat';
        const statRemaining = document.createElement('div');
        statRemaining.className = 'phase-stat';
        stats.appendChild(statPercent);
        stats.appendChild(statRemaining);
        stats.appendChild(completeBadge);

        function updateProgress() {
          const phaseState = saved[ph.name] || {};
          const doneCount = phaseDays.filter(({day}) => phaseState[day.d]).length;
          const total = phaseDays.length;
          const percent = total ? Math.round((doneCount / total) * 100) : 0;
          progressFill.style.width = percent + '%';
          progressFill.style.background = ph.color;
          progressText.textContent = doneCount + '/' + total + ' jours';

          const remaining = total - doneCount;
          statPercent.textContent = percent + '% complété';
          statRemaining.textContent = remaining > 0 ? remaining + ' jour' + (remaining > 1 ? 's' : '') + ' à faire' : '';
          statRemaining.style.display = remaining > 0 ? '' : 'none';

          completeBadge.classList.toggle('visible', percent === 100);
        }

        ph.weeks.forEach((wk) => {
          const wDiv = document.createElement('div');
          wDiv.className = 'week';

          const head = document.createElement('div');
          head.className = 'week-head';
          head.setAttribute('role', 'button');
          head.setAttribute('tabindex', '0');

          const left = document.createElement('div');
          left.className = 'week-left';

          const lvl = document.createElement('span');
          lvl.className = 'wlevel';
          lvl.style.background = ph.lbg;
          lvl.style.color = ph.lc;
          lvl.textContent = wk.level;

          const nm = document.createElement('span');
          nm.className = 'wname';
          nm.textContent = wk.name;

          left.appendChild(lvl);
          left.appendChild(nm);

          const right = document.createElement('div');
          right.className = 'week-head-right';

          const weekCount = document.createElement('span');
          weekCount.className = 'week-progress-count';

          const dt = document.createElement('span');
          dt.className = 'wdates';
          dt.textContent = wk.dates;

          const checkAllBtn = document.createElement('span');
          checkAllBtn.className = 'week-check-all';
          checkAllBtn.textContent = 'Tout cocher';

          const arr = document.createElement('span');
          arr.className = 'arrow';
          arr.textContent = '▾';

          right.appendChild(weekCount);
          right.appendChild(dt);
          right.appendChild(checkAllBtn);
          right.appendChild(arr);
          head.appendChild(left);
          head.appendChild(right);

          const body = document.createElement('div');
          body.className = 'week-body';

          const rows = [];

          function updateWeekCount() {
            const phaseState = saved[ph.name] || {};
            const doneInWeek = wk.days.filter(d => phaseState[d.d]).length;
            const totalInWeek = wk.days.length;
            weekCount.textContent = doneInWeek + '/' + totalInWeek;
            weekCount.classList.toggle('all-done', doneInWeek === totalInWeek);
            checkAllBtn.textContent = doneInWeek === totalInWeek ? 'Tout décocher' : 'Tout cocher';
          }

          wk.days.forEach(day => {
            const row = document.createElement('div');
            row.className = 'day-row' + (day.rest ? ' rest' : '') + (day.exam ? ' exam-row' : '');
            const isDone = !!((saved[ph.name] || {})[day.d]);
            if (isDone) row.classList.add('done');

            const dayDate = parseDayDate(wk.dates, day.d);
            const isLate = !isDone && dayDate !== null && dayDate < today;
            if (isLate) row.classList.add('overdue');

            const lateBadgeHTML = '<span class="late-badge">En retard</span>';
            const lblContent = '<span class="day-lbl-name">' + day.d + '</span>' + (isLate ? lateBadgeHTML : '');

            row.innerHTML =
              '<div class="day-lbl">' + lblContent + '</div>' +
              '<div class="day-txt">' + day.t + '</div>' +
              '<div class="day-check"><input type="checkbox"' + (isDone ? ' checked' : '') + ' aria-label="Marquer ' + day.d + ' comme fait"></div>';

            const cb = row.querySelector('input');
            cb.addEventListener('click', function (e) {
              e.stopPropagation();
            });
            cb.addEventListener('change', function () {
              saved[ph.name] = saved[ph.name] || {};
              saved[ph.name][day.d] = this.checked;
              localStorage.setItem(storageKey, JSON.stringify(saved));
              row.classList.toggle('done', this.checked);
              if (this.checked) {
                row.classList.remove('overdue');
                const badge = row.querySelector('.late-badge');
                if (badge) badge.remove();
              } else if (dayDate !== null && dayDate < today) {
                row.classList.add('overdue');
                const lbl = row.querySelector('.day-lbl');
                if (!lbl.querySelector('.late-badge')) {
                  lbl.insertAdjacentHTML('beforeend', lateBadgeHTML);
                }
              }
              updateWeekCount();
              updateProgress();
            });

            rows.push({row, day, cb});
            body.appendChild(row);
          });

          checkAllBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            const phaseState = saved[ph.name] || {};
            const allDone = wk.days.every(d => phaseState[d.d]);
            const newState = !allDone;
            saved[ph.name] = saved[ph.name] || {};
            rows.forEach(({row, day, cb}) => {
              saved[ph.name][day.d] = newState;
              cb.checked = newState;
              row.classList.toggle('done', newState);
              if (newState) {
                row.classList.remove('overdue');
                const badge = row.querySelector('.late-badge');
                if (badge) badge.remove();
              } else {
                const d = parseDayDate(wk.dates, day.d);
                if (d !== null && d < today) {
                  row.classList.add('overdue');
                  const lbl = row.querySelector('.day-lbl');
                  if (!lbl.querySelector('.late-badge')) {
                    lbl.insertAdjacentHTML('beforeend', '<span class="late-badge">En retard</span>');
                  }
                }
              }
            });
            localStorage.setItem(storageKey, JSON.stringify(saved));
            updateWeekCount();
            updateProgress();
          });

          function toggle() {
            const isOpen = body.classList.contains('open');
            body.classList.toggle('open', !isOpen);
            arr.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
          }

          head.addEventListener('click', toggle);
          head.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {e.preventDefault(); toggle();}
          });

          updateWeekCount();
          wDiv.appendChild(head);
          wDiv.appendChild(body);
          phDiv.appendChild(wDiv);
        });

        stats.appendChild(completeBadge);
        updateProgress();
        root.appendChild(phDiv);
      });

      const firstBody = document.querySelector('.week-body');
      const firstArr = document.querySelector('.arrow');
      if (firstBody) {firstBody.classList.add('open'); firstArr.style.transform = 'rotate(180deg)';}
    }

    build();
  </script>
</body>

</html>
